# Demo identities and their data entitlements.
#
# The CLI has no login: `--user <id>` picks one of these. In production the
# identity comes from the IdP (signed JWT) and the entitlements from an
# entitlement service / IAM group mapping (docs/architecture.md, "Identity &
# entitlements").
#
# scope: "all" or a set of product filters. OpsFleet confirmed managers are scoped
# to their own brands, with the CEO seeing everything. Values within one dimension
# are OR-ed, dimensions are AND-ed. Allowed dimensions: brand (used here),
# category, department. The filter is applied in code to every table the user
# queries: products and order_items directly, and orders and customers only
# through purchases of in-scope products. The model cannot widen it.
# Brand names must match products.brand exactly; `python -m retail_agent doctor`
# checks that each scope matches products in the dataset.

users:
  ceo:
    name: Dana
    title: Chief Executive Officer
    scope: all

  maria:
    name: Maria
    title: Brand Manager, Calvin Klein and Tommy Hilfiger
    scope:
      brand: ["Calvin Klein", "Tommy Hilfiger"]

  tom:
    name: Tom
    title: Brand Manager, Levi's and Carhartt
    scope:
      brand: ["Levi's", "Carhartt"]
